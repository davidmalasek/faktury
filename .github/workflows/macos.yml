# Testy, sestavení Faktury.app na macOS (okno aplikace jde zkompilovat jen na Macu) a zkouška
# aplikace ke stažení. Když je v main v souboru VERSION číslo, které ještě nevyšlo, vydá se nová
# verze s Faktury.zip a Faktury u ostatních si ji při dalším otevření stáhnou.
name: macOS
on: [push, pull_request]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Testy
        run: python3 -m unittest discover tests
      - name: Vývojová instalace
        run: bash instalovat.sh "$RUNNER_TEMP"
      - name: Sestavení Faktury.zip
        run: |
          bash macos/sestavit.sh "$RUNNER_TEMP/vydani/Faktury.app"
          ditto -c -k --keepParent "$RUNNER_TEMP/vydani/Faktury.app" "$RUNNER_TEMP/Faktury.zip"
      - name: Zkouška Faktury.zip jako po stažení
        run: |
          support="$HOME/Library/Application Support/Faktury"
          ditto -x -k "$RUNNER_TEMP/Faktury.zip" "$RUNNER_TEMP/stazeno"
          open "$RUNNER_TEMP/stazeno/Faktury.app"
          for _ in $(seq 1 180); do curl -sf -o /dev/null http://localhost:8765/api/version && break; sleep 1; done
          cat "$support/data/server.log" || true
          curl -sf http://localhost:8765/api/version
          pgrep -x Faktury
          # stažený Python a certifikáty (ARES a aktualizace jdou přes HTTPS)
          SSL_CERT_FILE="$support/python/cacert.pem" "$support/python/bin/python3" -c \
            "import urllib.request; urllib.request.urlopen('https://api.github.com', timeout=20); print('HTTPS v pořádku')"
          pkill -x Faktury
          kill "$(cat "$support/data/server.pid")"
      - uses: actions/upload-artifact@v4
        with:
          name: Faktury
          path: ${{ runner.temp }}/Faktury.zip

  release:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: Faktury
      - name: Vydání nové verze
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(tr -d '[:space:]' < VERSION)
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "Verze $version už vyšla."
            exit 0
          fi
          previous=$(git describe --tags --abbrev=0 2>/dev/null || true)
          git log --pretty='- %s' ${previous:+"$previous"..}HEAD > notes.md
          gh release create "v$version" Faktury.zip --title "Faktury $version" --notes-file notes.md --target "$GITHUB_SHA"
